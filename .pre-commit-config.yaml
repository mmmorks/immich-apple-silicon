# Pre-commit gate for the parent repo (the immich-accelerator CLI).
# Install once with: ./scripts/setup-git-hooks.sh  (or: pre-commit install)
# Mirrors the CI `lint` job: ruff lint + ruff format + the fast pytest suite,
# plus a gitleaks secret scan.
#
# Why gitleaks runs HERE and not only in CI: a CI secret scan fires only after
# the push, by which point the secret is already on the remote (and in history,
# forks, and Actions logs) and must be treated as compromised. Catching it at
# commit time is the actual prevention; the CI `secrets-scan` job is just a
# backstop for commits made without these hooks installed. Requires the gitleaks
# binary on PATH (brew install gitleaks).
#
# Note: this only covers the parent repo's files. The ml/ submodule is a
# separate git repo with its own .pre-commit-config.yaml — submodule file
# changes are committed there, not here.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        args: [--fix]
      - id: ruff-format
        name: ruff (format)

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (scan staged changes for secrets)
        entry: gitleaks git --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: pytest-fast
        name: pytest (fast — excludes slow integration tests)
        entry: python -m pytest -q -m "not slow"
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
