name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install tooling
        # ruff/pyright need no project deps; fastapi/uvicorn/numpy/pillow/httpx
        # are imported by the dashboard + tests so pyright can resolve them.
        run: pip install ruff==0.15.16 pyright pytest fastapi uvicorn numpy pillow httpx
      - name: Ruff lint (parent + ml)
        # The two repos carry separate pyproject.toml configs; ruff picks the
        # nearest one per file. `.` excludes ml/ (parent config), so lint it
        # explicitly with its own config.
        run: |
          ruff check .
          ruff check ml
      - name: Ruff format check (parent + ml)
        run: |
          ruff format --check .
          ruff format --check ml
      - name: Pyright type check (parent)
        # ml/ is excluded: its type check needs the heavy native venv
        # (mlx is Apple-Silicon-only) which can't be installed on Linux runners.
        run: pyright
      - name: Run pytest (fast)
        run: pytest -v -m "not slow"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  fresh-install-macos:
    # Runs on a clean macOS Apple Silicon runner — no global pip
    # packages, no leftover venvs. Catches the "works on my machine"
    # class of bug (issue #17: dashboard ModuleNotFoundError) before
    # it reaches users. The slow marker enables the venv+pip
    # integration test that builds a pristine fastapi+uvicorn env.
    #
    # EMERGENCY OVERRIDE: if macos-26 runners become flaky and this
    # blocks a release, trigger `update-homebrew.yml` manually via
    # `gh workflow run update-homebrew.yml -f tag=vX.Y.Z` — that
    # workflow bypasses CI entirely.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pytest only (simulate fresh Mac)
        run: pip install pytest
      - name: Run fast fresh-install regression checks
        run: pytest -v tests/test_fresh_install.py -m "not slow"
      - name: Run slow integration test (real venv + pip install)
        # Separate step so a failure here is still visible as
        # "slow step failed" rather than masking the fast ones.
        run: pytest -v tests/test_fresh_install.py -m slow

  ml-tests:
    # The ml/ submodule (immich-ml-metal) is the native Metal ML service. Its
    # pytest suite — the CLIP / face-embedding / OCR parity guards and the
    # preprocessing pins — runs in STUB_MODE (no real model weights, fully
    # mocked downloads) but still imports the native stack (mlx, insightface,
    # onnxruntime, opencv), so it needs a real Apple-Silicon venv. The parent
    # pytest run excludes ml/ (norecursedirs in pytest.ini), so without this job
    # a regression in the MLX models or a dependency bump would pass every gate
    # green.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt
      - name: Build ml venv
        # System python lacks mlx/insightface/cv2; build an isolated venv from
        # the service's own requirements, exactly as a real install would.
        working-directory: ml
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Run ml pytest suite
        working-directory: ml
        run: .venv/bin/python -m pytest -v

  fresh-install-docker:
    # Docker E2E: generates compose from template, starts the full
    # Immich stack, validates API + detection. Runs on Ubuntu where
    # Docker is pre-installed (macOS runners can't run Docker VMs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Generate compose from template
        run: |
          python3 -c "
          import sys, os, secrets
          from pathlib import Path
          sys.path.insert(0, '.')
          from immich_accelerator.__main__ import _COMPOSE_TEMPLATE
          test_dir = Path('/tmp/fresh-install-ci')
          test_dir.mkdir(parents=True, exist_ok=True)
          photos = '/tmp/test-photos'
          os.makedirs(photos, exist_ok=True)
          data = str(test_dir / 'data')
          os.makedirs(data, exist_ok=True)
          compose = _COMPOSE_TEMPLATE.replace('{photos_mount}', f'{photos}:{photos}:ro').replace('{user_line}', '')
          (test_dir / 'docker-compose.yml').write_text(compose)
          pw = secrets.token_urlsafe(24)
          env = f'UPLOAD_LOCATION={data}\nDB_PASSWORD={pw}\nDB_HOSTNAME=immich_postgres\nDB_USERNAME=postgres\nDB_DATABASE_NAME=immich\nREDIS_HOSTNAME=immich_redis\n'
          (test_dir / '.env').write_text(env)
          print('Compose generated')
          "
      - name: Validate compose syntax
        run: docker compose -f /tmp/fresh-install-ci/docker-compose.yml config > /dev/null
      - name: Start Immich stack
        run: |
          cd /tmp/fresh-install-ci
          docker compose up -d
          echo "Waiting for API..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:2283/api/server/ping 2>/dev/null | grep -q pong; then
              echo "API up after ${i}x3s"
              break
            fi
            sleep 3
          done
          curl -sf http://localhost:2283/api/server/ping | grep -q pong || { echo "API never came up"; docker logs immich_server; exit 1; }
      - name: Verify all containers running
        run: |
          docker ps --format "{{.Names}}\t{{.Status}}" | grep immich
          [ $(docker ps --format "{{.Names}}" | grep -c immich) -eq 3 ] || { echo "Not all containers running"; exit 1; }
      - name: Verify setup detection
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from immich_accelerator.__main__ import detect_immich
          immich = detect_immich('docker')
          assert immich['version'], 'no version'
          assert immich['workers_include'] == 'api', f'wrong workers: {immich[\"workers_include\"]}'
          assert immich.get('media_location'), 'no media_location'
          print(f'Detected: v{immich[\"version\"]}, workers={immich[\"workers_include\"]}')
          print(f'Media: {immich[\"media_location\"]}')
          print('Detection: OK')
          "
      - name: Tear down
        if: always()
        run: cd /tmp/fresh-install-ci && docker compose down -v 2>/dev/null || true

  auto-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, secrets-scan, fresh-install-macos, ml-tests, fresh-install-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check for version bump and tag
        id: tag
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${VERSION} — creating tag"
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create draft release with changelog
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG_NAME#v}"
          # Find the previous release tag to capture all changelog sections since then
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          PREV_VERSION="${PREV_TAG#v}"
          if [ -n "$PREV_VERSION" ]; then
            # Extract all changelog sections from current version down to previous release
            NOTES=$(awk "/^## ${PREV_VERSION}[[:space:]]/{exit} /^## ${VERSION}[[:space:]]/{found=1; next} found{print}" CHANGELOG.md)
          else
            # First release — grab everything after the first ## heading
            NOTES=$(awk "/^## ${VERSION}[[:space:]]/{found=1; next} found{print}" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG_NAME}"
          fi
          cat > /tmp/release-notes.md << ENDNOTES
          ${NOTES}

          ### Upgrade
          \`\`\`bash
          brew upgrade immich-accelerator
          immich-accelerator setup   # if first time or new features require it
          \`\`\`
          ENDNOTES
          sed -i 's/^          //' /tmp/release-notes.md
          gh release create "${TAG_NAME}" \
            --latest \
            --title "Immich Accelerator ${TAG_NAME}" \
            --notes-file /tmp/release-notes.md
      - name: Trigger Homebrew formula update
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run update-homebrew.yml -f tag="$TAG_NAME"
